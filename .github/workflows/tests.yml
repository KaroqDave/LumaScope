name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras)
        run: python -m pip install -e .[dev]
      - name: Run tests
        # The decode/emit/chunked/orchestrate/replay/parser tests are pure stdlib and run
        # everywhere; the Frida HID/WinUSB capture tests skip cleanly off Windows / without frida.
        run: pytest -q
